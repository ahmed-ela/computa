<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Lumen Registry - Record</title><style>body{font:17px/1.6 system-ui,sans-serif;max-width:900px;margin:3rem auto;padding:0 1rem;color:#172338;background:#f7f9fc}header,main,section,article{margin:1rem 0;padding:1rem;border:1px solid #b7c6d8;background:white}a{margin:.3rem}input{font:inherit;padding:.5rem;width:75%}label{display:block;font-weight:600}</style></head><body>
<header><a href="lumen-home.html">Registry workspace</a></header>
<main><article><h1 id="record-title">No record selected</h1><p id="record-body">Choose a record from the results.</p></article></main>
<script>
const records = {
  l24: { title: "Orchid Basin intake note", body: "The Orchid Basin intake note accepted 42 bundles. Delivery took place on 6 February 2037." },
  l25: { title: "Orchid Ridge inspection note", body: "The Orchid Ridge inspection note cleared 9 kits. Inspection took place on 3 February 2037." },
  l26: { title: "Silver Basin intake note", body: "The Silver Basin intake note accepted 16 bundles. Delivery took place on 5 February 2037." },
};
const key = new URLSearchParams(location.search).get("entry");
const record = Object.prototype.hasOwnProperty.call(records, key) ? records[key] : null;
if (record) {
  document.getElementById("record-title").textContent = record.title;
  document.getElementById("record-body").textContent = record.body;
}
</script>
</body></html>
