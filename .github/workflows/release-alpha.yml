name: Publish Computa alpha
run-name: Publish Computa ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, such as v0.1.2-alpha.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: computa-alpha-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish the prepared alpha
    runs-on: macos-26
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository's default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5

      - name: Verify the draft assets and publish the alpha
        run: bun Scripts/publish-alpha.ts --tag "$RELEASE_TAG" --publish
