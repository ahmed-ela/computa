<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Macrouse isolated borrowed-CDP fixture</title>
<style>body { font: 18px system-ui; margin: 32px } label, button, output { display: block; margin: 16px }</style>
<h1>Macrouse isolated borrowed-CDP fixture</h1>
<button id="increment">Increment fixture counter</button>
<output id="count" aria-live="polite">Counter 0</output>
<label>Fixture Unicode value <input id="value" type="text" autocomplete="off"></label>
<output id="echo" aria-live="polite">Value empty</output>
<script>
let count = 0;
document.querySelector('#increment').addEventListener('click', () => {
  document.querySelector('#count').textContent = `Counter ${++count}`;
});
document.querySelector('#value').addEventListener('input', event => {
  document.querySelector('#echo').textContent = `Value ${event.target.value}`;
});
</script>
</html>
