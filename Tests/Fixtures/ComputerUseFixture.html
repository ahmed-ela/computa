<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Computa Computer Use Fixture</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f1ff; }
      main { width: min(560px, calc(100vw - 64px)); padding: 48px; text-align: center; background: white; border-radius: 24px; box-shadow: 0 20px 60px #493b7b26; }
      h1 { margin-top: 0; }
      button { padding: 14px 22px; border: 0; border-radius: 12px; color: white; background: #6848d9; font: inherit; font-weight: 700; cursor: pointer; }
      #result { min-height: 1.5em; margin-bottom: 24px; font-size: 22px; font-weight: 700; color: #4125a7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Computa browser test</h1>
      <p id="result" aria-live="polite">READY_FOR_QWEN</p>
      <button id="verify" type="button">Complete computer-use test</button>
    </main>
    <script>
      const embeddedCompletionToken = null;
      const parameters = new URLSearchParams(window.location.search);
      const completionToken = embeddedCompletionToken || parameters.get('completion_token');
      document.querySelector('#verify').addEventListener('click', () => {
        document.querySelector('#result').textContent = completionToken || 'LOCALCODEX_COMPLETION_TOKEN_MISSING';
      });
    </script>
  </body>
</html>
