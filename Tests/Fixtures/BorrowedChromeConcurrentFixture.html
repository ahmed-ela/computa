<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Computa concurrent isolated fixture</title>
<h1>Computa concurrent isolated fixture</h1>
<button id="increment">Increment fixture counter</button>
<output id="count">Counter 0</output>
<label>Fixture Unicode value <input id="value" autocomplete="off"></label>
<output id="echo">Value empty</output>
<script>
let count = 0;
document.querySelector('#increment').addEventListener('click', () => {
  document.querySelector('#count').textContent = `Counter ${++count}`;
});
document.querySelector('#value').addEventListener('input', event => {
  document.querySelector('#echo').textContent = `Value ${event.target.value}`;
});
</script>
</html>
