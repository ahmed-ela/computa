name: Mactopus

options:
  bundleIdPrefix: com.ahmedelamin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_CODE_COVERAGE: NO

targets:
  AutomationCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex.AutomationCore
        DEFINES_MODULE: YES

  Mactopus:
    type: application
    platform: macOS
    sources:
      - path: Sources/Mactopus
        excludes:
          - Resources
      - path: Sources/Mactopus/Resources/WebUI
        type: folder
        buildPhase: resources
      - path: Sources/Mactopus/Resources/VisualGrounding
        type: folder
        buildPhase: resources
      - path: Sources/Mactopus/Resources/AgentRuntime
        type: folder
        buildPhase: resources
      - path: Sources/Mactopus/Resources/MLXServer
        type: folder
        buildPhase: resources
      - path: BrowserExtension
        type: folder
        buildPhase: resources
        excludes:
          - '*.test.js'
    preBuildScripts:
      - name: Build signed Chrome native bridge
        script: '/bin/sh "$SRCROOT/Scripts/build-chrome-bridge.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"'
        inputFiles:
          - $(SRCROOT)/Scripts/build-chrome-bridge.sh
          - $(SRCROOT)/Sources/Mactopus/Runtime/ChromeBridgeIPC.swift
          - $(SRCROOT)/Sources/Mactopus/Runtime/ChromeBridgeIdentity.swift
          - $(SRCROOT)/Sources/ChromeBridgeHost/main.swift
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ChromeBridge/ChromeBridgeHost
        basedOnDependencyAnalysis: false
    dependencies:
      - target: AutomationCore
    settings:
      base:
        # Stable identity preserves settings and macOS permission association.
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex
        PRODUCT_NAME: Mactopus
        DEVELOPMENT_TEAM: MSMG8CJLB3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Mactopus-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  MactopusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MactopusTests
    dependencies:
      - target: Mactopus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodexTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: MSMG8CJLB3
        CODE_SIGN_STYLE: Automatic

  AutomationCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AutomationCoreTests
    dependencies:
      - target: AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex.AutomationCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Mactopus:
    build:
      targets:
        AutomationCore: all
        Mactopus: all
        MactopusTests: [test]
        AutomationCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MactopusTests
        - name: AutomationCoreTests
