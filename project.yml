name: Kolmogor

options:
  bundleIdPrefix: com.ahmedelamin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_CODE_COVERAGE: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  AutomationCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex.AutomationCore
        DEFINES_MODULE: YES

  Kolmogor:
    type: application
    platform: macOS
    sources:
      - path: Sources/Computa
        excludes:
          - Resources
      - path: Sources/Computa/Resources/WebUI
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/VisualGrounding
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/AgentRuntime
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/MLXServer
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/CodexDesktop
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/ProviderSetup
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/BrowserModels
        type: folder
        buildPhase: resources
      - path: Sources/Computa/Resources/BrowserToolCatalog.json
        buildPhase: resources
      - path: Sources/Computa/Resources/Tokenizers
        type: folder
        buildPhase: resources
    dependencies:
      - target: AutomationCore
      - package: Sparkle
    configFiles:
      Debug: Config/Version.xcconfig
      Release: Config/Version.xcconfig
    settings:
      base:
        # Local builds must never register for the public app's macOS permissions.
        # The notarized release worker supplies Config/Distribution.xcconfig.
        KOLMOGOR_APP_IDENTIFIER: com.ahmedelamin.LocalCodex.dev
        KOLMOGOR_DISPLAY_NAME: Kolmogor Dev
        PRODUCT_BUNDLE_IDENTIFIER: $(KOLMOGOR_APP_IDENTIFIER)
        PRODUCT_NAME: Kolmogor
        PRODUCT_MODULE_NAME: Computa
        DEVELOPMENT_TEAM: MSMG8CJLB3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Kolmogor-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  ComputaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ComputaTests
    dependencies:
      - target: Kolmogor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodexTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: MSMG8CJLB3
        CODE_SIGN_STYLE: Automatic

  AutomationCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AutomationCoreTests
    dependencies:
      - target: AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex.AutomationCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Kolmogor:
    build:
      targets:
        AutomationCore: all
        Kolmogor: all
        ComputaTests: [test]
        AutomationCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: ComputaTests
        - name: AutomationCoreTests
