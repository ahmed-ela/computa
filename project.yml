name: LocalCodex

options:
  bundleIdPrefix: com.ahmedelamin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_CODE_COVERAGE: NO

targets:
  AutomationCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex.AutomationCore
        DEFINES_MODULE: YES

  LocalCodex:
    type: application
    platform: macOS
    sources:
      - path: Sources/LocalCodex
        excludes:
          - Resources
      - path: Sources/LocalCodex/Resources/WebUI
        type: folder
        buildPhase: resources
      - path: Sources/LocalCodex/Resources/VisualGrounding
        type: folder
        buildPhase: resources
    dependencies:
      - target: AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex
        PRODUCT_NAME: LocalCodex
        DEVELOPMENT_TEAM: MSMG8CJLB3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/LocalCodex-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  LocalCodexTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LocalCodexTests
    dependencies:
      - target: LocalCodex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodexTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: MSMG8CJLB3
        CODE_SIGN_STYLE: Automatic

  AutomationCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AutomationCoreTests
    dependencies:
      - target: AutomationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedelamin.LocalCodex.AutomationCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LocalCodex:
    build:
      targets:
        AutomationCore: all
        LocalCodex: all
        LocalCodexTests: [test]
        AutomationCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: LocalCodexTests
        - name: AutomationCoreTests
