apiVersion: v1
kind: LimitRange
metadata: {name: account-containers}
spec:
  limits:
  - type: Container
    default: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
    defaultRequest: {cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: workspace-capacity}
spec:
  hard:
    pods: "8"
    persistentvolumeclaims: "7"
    requests.storage: 9Gi
    limits.memory: 10Gi
    limits.cpu: "10"
