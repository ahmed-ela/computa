apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobs
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: jobs
        persistentVolumeClaim:
          claimName: jobs
      - name: code
        configMap:
          name: gateway-code
      containers:
      - name: gateway
        image: localhost/kolmogor-agent:workspace-v2
        imagePullPolicy: Never
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
        volumeMounts:
        - name: jobs
          mountPath: /data
        - name: code
          mountPath: /app
          readOnly: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command:
        - node
        - /app/gateway.mjs
        - serve
        env:
        - name: WORKER_TOKEN
          valueFrom:
            secretKeyRef:
              name: worker
              key: token
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
  - Ingress
  ingress: []
